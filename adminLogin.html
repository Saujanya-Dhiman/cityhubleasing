<body>

    <!-- Decorative HUD behaviour only: live clock, typewriter line, cursor-follow glow. No auth logic here. -->
    <script>
        (function () {
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Live session clock
            var clockEl = document.getElementById('liveClock');
            function tickClock() {
                if (!clockEl) return;
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.textContent = hh + ':' + mm + ':' + ss;
            }
            tickClock();
            setInterval(tickClock, 1000);

            // Typewriter line
            var typeEl = document.getElementById('typeText');
            var phrases = [
                'ESTABLISHING SECURE CHANNEL...',
                'AUTHORIZED PERSONNEL ONLY',
                'CITYHUB LEASING // OPS CONSOLE'
            ];

            if (typeEl) {
                if (reduceMotion) {
                    typeEl.textContent = phrases[0];
                } else {
                    var pIndex = 0, cIndex = 0, deleting = false;
                    function typeStep() {
                        var current = phrases[pIndex];
                        if (!deleting) {
                            cIndex++;
                            typeEl.textContent = current.slice(0, cIndex);
                            if (cIndex === current.length) {
                                deleting = false;
                                setTimeout(function () { deleting = true; typeStep(); }, 1600);
                                return;
                            }
                        } else {
                            cIndex--;
                            typeEl.textContent = current.slice(0, cIndex);
                            if (cIndex === 0) {
                                deleting = false;
                                pIndex = (pIndex + 1) % phrases.length;
                            }
                        }
                        setTimeout(typeStep, deleting ? 28 : 42);
                    }
                    typeStep();
                }
            }

            // Cursor-follow ambient glow
            if (!reduceMotion) {
                var glow = document.getElementById('bgGlow');
                document.addEventListener('mousemove', function (e) {
                    if (!glow) return;
                    var xPct = (e.clientX / window.innerWidth) * 100;
                    var yPct = (e.clientY / window.innerHeight) * 100;
                    glow.style.setProperty('--gx', xPct + '%');
                    glow.style.setProperty('--gy', yPct + '%');
                });
            }
        })();
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUI6xoxsREuNJ1XXd7VS1GD0vC0iUYynY",
            authDomain: "cityhubadmin.firebaseapp.com",
            projectId: "cityhubadmin",
            storageBucket: "cityhubadmin.firebasestorage.app",
            messagingSenderId: "347595626474",
            appId: "1:347595626474:web:33e5dfed12d586f88e4493",
            measurementId: "G-D9M2WH6F9C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function () {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const msgElement = document.getElementById("msg");

            if (email === "" || password === "") {
                msgElement.innerText = "Please enter both email and password";
                msgElement.style.color = "#EF4444"; // Red
                return;
            }

            // Visual feedback during login
            const btn = document.querySelector('.login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Authenticating... <i class="ph ph-spinner ph-spin"></i>';
            btn.style.opacity = '0.9';
            btn.style.pointerEvents = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msgElement.innerText = "Login successful. Redirecting to Dashboard...";
                msgElement.style.color = "#10B981"; // Green

                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 800);
            }
            catch (error) {
                msgElement.innerText = "Invalid credentials. Please try again.";
                msgElement.style.color = "#EF4444"; // Red
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // Allow 'Enter' key to trigger login
        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
