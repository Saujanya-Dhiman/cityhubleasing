    <style>
        :root {
            --ink: #060608;
            --panel: #0D0E12;
            --gold: #CCFF00;
            --gold-lt: #DFFF4F;
            --gold-dk: #A3CC00;
            --slate: #CBD5E1;
            --slate-lt: #94A3B8;
            --border: rgba(212, 168, 83, 0.18);
            --border-soft: rgba(255, 255, 255, 0.07);
            --f-display: 'Playfair Display', Georgia, serif;
            --f-body: 'DM Sans', system-ui, sans-serif;
            --f-mono: 'DM Mono', monospace;
            --r-sm: 6px;
            --r-md: 14px;
            --r-lg: 22px;
            --r-xl: 32px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--ink); }
        ::-webkit-scrollbar-thumb { background: #2A2A32; border-radius: 10px; border: 2px solid var(--ink); }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-dk); }
        ::selection { background: rgba(212, 168, 83, 0.28); color: var(--gold-lt); }

        html { background: var(--ink); }

        body {
            font-family: var(--f-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--ink);
            padding: 20px;
            color: var(--slate);
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

        /* ================= LIVE HUD BACKDROP ================= */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--ink);
        }

        .backdrop-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(212, 168, 83, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 168, 83, 0.055) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 78%);
        }

        .backdrop-glow {
            position: absolute;
            top: var(--gy, 30%);
            left: var(--gx, 50%);
            width: 720px;
            height: 720px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(212, 168, 83, 0.14) 0%, transparent 68%);
            border-radius: 50%;
            pointer-events: none;
            transition: left 1.4s var(--ease-out-expo), top 1.4s var(--ease-out-expo);
        }

        .backdrop-glow-fixed {
            position: absolute;
            bottom: -18%;
            right: -12%;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(212, 168, 83, 0.07) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.022) 0px,
                rgba(255, 255, 255, 0.022) 1px,
                transparent 2px,
                transparent 3px
            );
            opacity: 0.5;
        }

        .scan-sweep {
            position: fixed;
            left: 0;
            width: 100%;
            height: 140px;
            top: -140px;
            z-index: 6;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(212, 168, 83, 0.045), transparent);
            animation: sweep 7s linear infinite;
        }

        @keyframes sweep {
            0% { top: -140px; }
            100% { top: 100vh; }
        }

        h1, h2, h3 {
            font-family: var(--f-display);
            color: #F4F1E9;
        }

        /* Brand mark, top-left */
        .brand-mark {
            position: fixed;
            top: 30px;
            left: 5%;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--f-display);
            font-size: 19px;
            font-weight: 800;
            color: #F4F1E9;
            letter-spacing: -0.3px;
        }

        .brand-dot {
            width: 7px;
            height: 7px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(212, 168, 83, 0.7);
        }

        .brand-tag {
            font-family: var(--f-mono);
            font-size: 10px;
            color: var(--slate);
            letter-spacing: 1.5px;
            margin-left: 4px;
            opacity: 0.7;
        }

        /* ================= LOGIN PANEL ================= */
        .login-card {
            width: 100%;
            max-width: 460px;
            background: linear-gradient(180deg, rgba(19, 20, 26, 0.92), rgba(13, 14, 18, 0.96));
            border-radius: var(--r-xl);
            border: 1px solid var(--border);
            box-shadow:
                0 40px 90px -20px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(212, 168, 83, 0.05),
                0 0 60px -12px rgba(212, 168, 83, 0.12);
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: bootIn 1.1s var(--ease-out-expo) 0.05s forwards;
            overflow: hidden;
        }

        @keyframes bootIn {
            0%   { opacity: 0; transform: translateY(26px) scale(0.98); }
            55%  { opacity: 1; }
            62%  { opacity: 0.55; }
            70%  { opacity: 1; }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Terminal chrome bar */
        .term-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(0, 0, 0, 0.2);
        }

        .term-dots {
            display: flex;
            gap: 7px;
        }

        .term-dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: block;
            opacity: 0.85;
        }

        .term-dots span:nth-child(1) { background: #E5605A; }
        .term-dots span:nth-child(2) { background: #E5B85A; }
        .term-dots span:nth-child(3) { background: #58C97C; }

        .term-title {
            font-family: var(--f-mono);
            font-size: 11px;
            color: var(--slate);
            letter-spacing: 1.5px;
            flex: 1;
        }

        .term-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--f-mono);
            font-size: 10px;
            color: #6FCF8E;
            letter-spacing: 1.5px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6FCF8E;
            box-shadow: 0 0 8px 2px rgba(111, 207, 142, 0.7);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .login-card-inner {
            padding: 40px 40px 34px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-bottom: 22px;
            font-size: 23px;
            font-family: var(--f-display);
            font-weight: 800;
            color: #F4F1E9;
            letter-spacing: -0.3px;
        }

        .login-logo i {
            color: var(--gold);
            font-size: 26px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .type-line {
            font-family: var(--f-mono);
            font-size: 12px;
            color: var(--gold);
            letter-spacing: 0.5px;
            min-height: 16px;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .type-line .cursor {
            display: inline-block;
            color: var(--gold);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .login-header h2 {
            font-family: var(--f-mono);
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #F4F1E9;
            text-shadow: 0 0 22px rgba(212, 168, 83, 0.35);
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--slate);
            font-size: 14px;
            line-height: 1.65;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Live readout strip */
        .hud-readout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border-soft);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-md);
            overflow: hidden;
            margin-bottom: 28px;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
        }

        .hud-label {
            display: block;
            font-family: var(--f-mono);
            font-size: 9.5px;
            color: var(--slate-lt);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .hud-value {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--f-mono);
            font-size: 13px;
            color: var(--gold-lt);
            letter-spacing: 0.5px;
        }

        .input-label {
            display: block;
            font-family: var(--f-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--slate);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-lt);
            font-size: 18px;
            transition: color 0.3s var(--ease-in-out);
        }

        .input-group input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            border-radius: var(--r-sm);
            border: 1px solid var(--border-soft);
            background: rgba(0, 0, 0, 0.3);
            outline: none;
            transition: border-color 0.3s var(--ease-in-out), box-shadow 0.3s var(--ease-in-out);
            font-size: 14px;
            font-family: var(--f-mono);
            color: #F4F1E9;
        }

        .input-group input::placeholder {
            color: #4A4E58;
            font-family: var(--f-body);
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.14), 0 0 18px rgba(212, 168, 83, 0.15);
        }

        .input-group input:focus + i {
            color: var(--gold);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--gold);
            border-radius: var(--r-sm);
            background: rgba(212, 168, 83, 0.1);
            color: var(--gold-lt);
            font-size: 13.5px;
            font-weight: 600;
            font-family: var(--f-mono);
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color 0.3s var(--ease-in-out), background 0.3s var(--ease-in-out), box-shadow 0.3s var(--ease-in-out), transform 0.25s var(--ease-out-expo);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.16), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s var(--ease-out-expo);
        }

        .login-btn:hover {
            background: var(--gold);
            color: #000000;
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.35);
            transform: translateY(-2px);
        }

        .login-btn:hover::before {
            left: 130%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:focus-visible,
        .back-link:focus-visible,
        .input-group input:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--slate);
            font-family: var(--f-mono);
            font-size: 11.5px;
            letter-spacing: 1px;
            text-decoration: none;
            margin-top: 24px;
            transition: color 0.25s var(--ease-in-out), gap 0.25s var(--ease-out-expo);
            justify-content: center;
            width: 100%;
        }

        .back-link:hover {
            color: var(--gold);
            gap: 12px;
        }

        #msg {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
            min-height: 20px;
            font-family: var(--f-mono);
            letter-spacing: 0.4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-mark { left: 24px; top: 22px; }
        }

        @media (max-width: 480px) {
            .login-card-inner { padding: 32px 24px 28px; }
            .term-bar { padding: 14px 18px; }
            .login-header h2 { font-size: 20px; letter-spacing: 2px; }
            .hud-readout { grid-template-columns: 1fr; }
            .brand-mark { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .login-card { opacity: 1; animation: none; transform: none; }
            .scan-sweep, .scanlines { display: none; }
        }
    </style>

    <!-- Decorative HUD behaviour only: live clock, typewriter line, cursor-follow glow. No auth logic here. -->
    <script>
        (function () {
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Live session clock
            var clockEl = document.getElementById('liveClock');
            function tickClock() {
                if (!clockEl) return;
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.textContent = hh + ':' + mm + ':' + ss;
            }
            tickClock();
            setInterval(tickClock, 1000);

            // Typewriter line
            var typeEl = document.getElementById('typeText');
            var phrases = [
                'ESTABLISHING SECURE CHANNEL...',
                'AUTHORIZED PERSONNEL ONLY',
                'CITYHUB LEASING // OPS CONSOLE'
            ];

            if (typeEl) {
                if (reduceMotion) {
                    typeEl.textContent = phrases[0];
                } else {
                    var pIndex = 0, cIndex = 0, deleting = false;
                    function typeStep() {
                        var current = phrases[pIndex];
                        if (!deleting) {
                            cIndex++;
                            typeEl.textContent = current.slice(0, cIndex);
                            if (cIndex === current.length) {
                                deleting = false;
                                setTimeout(function () { deleting = true; typeStep(); }, 1600);
                                return;
                            }
                        } else {
                            cIndex--;
                            typeEl.textContent = current.slice(0, cIndex);
                            if (cIndex === 0) {
                                deleting = false;
                                pIndex = (pIndex + 1) % phrases.length;
                            }
                        }
                        setTimeout(typeStep, deleting ? 28 : 42);
                    }
                    typeStep();
                }
            }

            // Cursor-follow ambient glow
            if (!reduceMotion) {
                var glow = document.getElementById('bgGlow');
                document.addEventListener('mousemove', function (e) {
                    if (!glow) return;
                    var xPct = (e.clientX / window.innerWidth) * 100;
                    var yPct = (e.clientY / window.innerHeight) * 100;
                    glow.style.setProperty('--gx', xPct + '%');
                    glow.style.setProperty('--gy', yPct + '%');
                });
            }
        })();
    </script>

            authDomain: "cityhubadmin.firebaseapp.com",
            projectId: "cityhubadmin",
            storageBucket: "cityhubadmin.firebasestorage.app",
            messagingSenderId: "347595626474",
            appId: "1:347595626474:web:33e5dfed12d586f88e4493",
            measurementId: "G-D9M2WH6F9C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function () {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const msgElement = document.getElementById("msg");

            if (email === "" || password === "") {
                msgElement.innerText = "Please enter both email and password";
                msgElement.style.color = "#EF4444"; // Red
                return;
            }

            // Visual feedback during login
            const btn = document.querySelector('.login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Authenticating... <i class="ph ph-spinner ph-spin"></i>';
            btn.style.opacity = '0.9';
            btn.style.pointerEvents = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msgElement.innerText = "Login successful. Redirecting to Dashboard...";
                msgElement.style.color = "#10B981"; // Green

                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 800);
            }
            catch (error) {
                msgElement.innerText = "Invalid credentials. Please try again.";
                msgElement.style.color = "#EF4444"; // Red
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // Allow 'Enter' key to trigger login
        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
